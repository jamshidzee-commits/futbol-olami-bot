name: Futbol olami results

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Тест: отправить последние 3 завершённых матча, игнорируя sent.json"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: futbol-olami-results
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests Pillow

      - name: Post finished matches
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TEST_MODE: ${{ github.event.inputs.test }}
        run: python scripts/post_results.py

      - name: Save sent matches
        run: |
          git config user.name "futbol-olami-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f sent.json ]; then
            echo "sent.json yo'q — saqlanadigan narsa yo'q"
            exit 0
          fi
          git add sent.json
          if git diff --cached --quiet; then
            echo "O'zgarish yo'q"
          else
            git commit -m "update sent matches"
            git pull --rebase
            git push
          fi
